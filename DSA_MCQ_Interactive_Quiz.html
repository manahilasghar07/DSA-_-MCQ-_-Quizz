<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DSA MCQ Practice Quiz</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f7fb;color:#172033}
.wrap{max-width:820px;margin:auto;padding:20px}.card{background:white;border-radius:18px;padding:24px;box-shadow:0 8px 30px #00000012}
h1{margin:0 0 6px;font-size:28px}.sub{color:#657085;margin-bottom:20px}
.top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.badge{background:#eef3ff;padding:8px 12px;border-radius:999px;font-size:14px}
.progress{height:9px;background:#e8edf5;border-radius:99px;overflow:hidden;margin:14px 0 22px}.bar{height:100%;width:0;background:#315efb;transition:.25s}
.q{font-size:21px;font-weight:700;line-height:1.45;margin-bottom:18px}
.opt{width:100%;padding:14px 16px;margin:9px 0;border:2px solid #e4e8ef;background:#fff;border-radius:12px;text-align:left;font-size:16px;cursor:pointer}
.opt:hover{border-color:#315efb;background:#f7f9ff}.opt.correct{border-color:#159447;background:#eaf9f0}.opt.wrong{border-color:#d83a3a;background:#fff0f0}
.feedback{margin-top:18px;padding:15px;border-radius:12px;line-height:1.55}.feedback.correct{background:#eaf9f0}.feedback.wrong{background:#fff0f0}
.actions{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}.btn{border:0;border-radius:11px;padding:12px 18px;cursor:pointer;font-size:15px;background:#315efb;color:white}.btn.secondary{background:#e9edf5;color:#172033}
.hidden{display:none}.result{text-align:center}.score{font-size:46px;font-weight:800;margin:12px}.section{font-weight:700;color:#315efb}
</style>
</head>
<body>
<div class="wrap"><div class="card">
<h1>DSA MCQ Practice Quiz</h1>
<div class="sub">60 questions • Arrays • Multi-Dimensional Arrays • Linear & Binary Search</div>
<div id="quiz">
<div class="top"><span class="badge" id="counter"></span><span class="badge" id="score">Score: 0</span></div>
<div class="progress"><div class="bar" id="bar"></div></div>
<div class="section" id="section"></div>
<div class="q" id="question"></div>
<div id="options"></div>
<div id="feedback" class="feedback hidden"></div>
<div class="actions"><button class="btn secondary" id="restart">Restart</button><button class="btn hidden" id="next">Next Question →</button></div>
</div>
<div id="result" class="result hidden"></div>
</div></div>
<script>
const questions = [{"section": "Arrays", "q": "An array is:", "options": ["Same-type elements in contiguous memory", "Different types stored randomly", "Elements without indexes", "Always a linked structure"], "answer": 0, "explanation": "An array stores same-type elements in contiguous memory."}, {"section": "Arrays", "q": "The first C++ array index is:", "options": ["-1", "1", "0", "Depends on capacity"], "answer": 2, "explanation": "C++ arrays use zero-based indexing, so the first index is 0."}, {"section": "Arrays", "q": "Which is a static array declaration?", "options": ["int marks;", "int marks[5];", "marks int[5];", "array marks;"], "answer": 1, "explanation": "The declaration int marks[5]; creates a fixed-size array of 5 integers."}, {"section": "Arrays", "q": "How many elements are initialized here: int a[] = {2,4,6,8};?", "options": ["3", "4", "5", "8"], "answer": 1, "explanation": "There are four values in the initializer list, so the array has 4 elements."}, {"section": "Arrays", "q": "According to the PPT, int scores[5] = {}; initializes elements to:", "options": ["Zeros", "Ones", "Random values", "Five"], "answer": 0, "explanation": "The empty initializer initializes the elements to zero."}, {"section": "Arrays", "q": "Base address = 1000, int size = 4 bytes. Address of A[3] is:", "options": ["1003", "1004", "1012", "1016"], "answer": 2, "explanation": "Using base + index × element size: 1000 + 3 × 4 = 1012."}, {"section": "Arrays", "q": "Address formula in the PPT is:", "options": ["Base + i", "Base + i × element size", "Base − i", "Base × i"], "answer": 1, "explanation": "The address is calculated as base address plus index multiplied by element size."}, {"section": "Arrays", "q": "Array elements are stored:", "options": ["Contiguously", "In sorted order always", "Only in registers", "With random gaps"], "answer": 0, "explanation": "Array elements are stored in contiguous memory locations."}, {"section": "Arrays", "q": "What does for(i=0; i<5; i++) do when printing a[i]?", "options": ["Prints five elements", "Prints only a[5]", "Deletes five elements", "Prints four elements"], "answer": 0, "explanation": "The loop runs for i = 0,1,2,3,4, so it prints five elements."}, {"section": "Arrays", "q": "Access by index has which listed complexity?", "options": ["O(n)", "O(log n)", "O(1)", "O(n²)"], "answer": 2, "explanation": "Direct array indexing is listed as constant time, O(1)."}, {"section": "Arrays", "q": "Linear search complexity in the array operations table is:", "options": ["O(1)", "O(n)", "O(log n)", "O(n²)"], "answer": 1, "explanation": "Linear search may inspect elements one by one, so its listed complexity is O(n)."}, {"section": "Arrays", "q": "Insertion at the end is listed as O(1) when:", "options": ["Space is available", "Array is sorted", "Array is empty only", "Capacity is zero"], "answer": 0, "explanation": "If space is available at the end, inserting there does not require shifting existing elements."}, {"section": "Arrays", "q": "For insertion, the valid position range in the shown code is:", "options": ["0 through size inclusive", "1 through size only", "0 through capacity inclusive", "-1 through size"], "answer": 0, "explanation": "The shown insertion logic allows positions from 0 through the current size."}, {"section": "Arrays", "q": "Why does insertion shift elements right from the end?", "options": ["To avoid overwriting elements before copying them", "To sort the array", "To reduce capacity", "To clear the array"], "answer": 0, "explanation": "Shifting from the end prevents an element from being overwritten before it is copied."}, {"section": "Arrays", "q": "Deletion shifts elements:", "options": ["Right", "Left", "Up", "Not at all"], "answer": 1, "explanation": "After deletion, later elements are shifted left to fill the gap."}, {"section": "Arrays", "q": "After a successful insertion, size:", "options": ["Decreases", "Increases by one", "Does not change", "Becomes zero"], "answer": 1, "explanation": "A successful insertion adds one logical element, so size increases by one."}, {"section": "Arrays", "q": "After a successful deletion, size:", "options": ["Increases", "Decreases by one", "Doubles", "Stays unchanged"], "answer": 1, "explanation": "A successful deletion removes one logical element, so size decreases by one."}, {"section": "Arrays", "q": "Insert 9 at index 2 in {1,2,3,4}. Result:", "options": ["1,2,9,3,4", "1,9,2,3,4", "9,1,2,3,4", "1,2,3,9,4"], "answer": 0, "explanation": "Index 2 is before the original 3, so the result is 1,2,9,3,4."}, {"section": "Arrays", "q": "Delete index 1 from {1,2,3,4}. Logical result:", "options": ["1,2,4", "1,3,4", "2,3,4", "1,2,3"], "answer": 1, "explanation": "Deleting index 1 removes 2, leaving 1,3,4."}, {"section": "Arrays", "q": "Traversal of all n elements is listed as:", "options": ["O(1)", "O(log n)", "O(n)", "O(n²)"], "answer": 2, "explanation": "Visiting all n elements requires linear time, O(n)."}, {"section": "Multi-Dimensional Arrays", "q": "A multidimensional array uses:", "options": ["Multiple indices", "No indices", "Only strings", "Only pointers"], "answer": 0, "explanation": "A multidimensional array is accessed using multiple indices."}, {"section": "Multi-Dimensional Arrays", "q": "int A[3][3] has:", "options": ["3 total elements", "3 rows and 3 columns", "3 columns and 9 rows", "3 dimensions"], "answer": 1, "explanation": "The declaration represents 3 rows and 3 columns."}, {"section": "Multi-Dimensional Arrays", "q": "A matrix with R rows and C columns contains:", "options": ["R+C elements", "R×C elements", "R−C elements", "R/C elements"], "answer": 1, "explanation": "Total cells equal rows multiplied by columns: R×C."}, {"section": "Multi-Dimensional Arrays", "q": "C++ stores 2D arrays in:", "options": ["Column-major order", "Row-major order", "Random order", "Sorted order"], "answer": 1, "explanation": "The PPT states that C++ stores 2D arrays in row-major order."}, {"section": "Multi-Dimensional Arrays", "q": "A cell is accessed as:", "options": ["A[row][col]", "A[row,col]", "A(row,col)", "A{row}{col}"], "answer": 0, "explanation": "C++ uses separate bracket pairs for the row and column indices."}, {"section": "Multi-Dimensional Arrays", "q": "A basic 2D traversal usually uses:", "options": ["One loop", "Two nested loops", "No loops", "Four loops"], "answer": 1, "explanation": "A typical 2D traversal uses one loop for rows and a nested loop for columns."}, {"section": "Multi-Dimensional Arrays", "q": "Row-major traversal visits first:", "options": ["Column 0", "Row 0", "Main diagonal only", "Last row"], "answer": 1, "explanation": "Row-major traversal proceeds across the first row before moving to the next row."}, {"section": "Multi-Dimensional Arrays", "q": "Column-major traversal changes:", "options": ["Internal storage order", "Visit order only", "Element types", "Number of cells"], "answer": 1, "explanation": "It changes the order in which elements are visited, not the underlying storage order."}, {"section": "Multi-Dimensional Arrays", "q": "For {{1,2,3},{4,5,6},{7,8,9}}, A[1][2] is:", "options": ["2", "4", "5", "6"], "answer": 3, "explanation": "With zero-based indices, row 1 is {4,5,6}; column 2 is 6."}, {"section": "Multi-Dimensional Arrays", "q": "For the same matrix, row 1 sum (zero-based) is:", "options": ["6", "15", "24", "45"], "answer": 1, "explanation": "Row 1 contains 4, 5, and 6, whose sum is 15."}, {"section": "Multi-Dimensional Arrays", "q": "For the same matrix, column 0 sum is:", "options": ["12", "15", "18", "21"], "answer": 0, "explanation": "Column 0 contains 1, 4, and 7, giving 1+4+7 = 12."}, {"section": "Multi-Dimensional Arrays", "q": "The main diagonal condition shown is:", "options": ["r<c", "r>c", "r==c", "r!=c"], "answer": 2, "explanation": "A main-diagonal element has equal row and column indices, r==c."}, {"section": "Multi-Dimensional Arrays", "q": "Inserting a value within one row shifts that row:", "options": ["Right", "Left", "Up", "Down"], "answer": 0, "explanation": "Insertion within a row shifts the existing elements to the right."}, {"section": "Multi-Dimensional Arrays", "q": "Insertion within a row of C columns has worst-case complexity:", "options": ["O(1)", "O(C)", "O(R)", "O(R×C×C)"], "answer": 1, "explanation": "In the shown operation, up to C elements in the row may need shifting."}, {"section": "Multi-Dimensional Arrays", "q": "Insert 99 at position 1 into row {4,5,6}. Result:", "options": ["4,5,6,99", "4,99,5,6", "99,4,5,6", "4,5,99,6"], "answer": 1, "explanation": "Position 1 is between 4 and 5, producing 4,99,5,6."}, {"section": "Multi-Dimensional Arrays", "q": "When inserting a full row at pos, rows below pos shift:", "options": ["Up", "Down", "Left", "Not at all"], "answer": 1, "explanation": "Rows below the insertion position shift downward to make room."}, {"section": "Multi-Dimensional Arrays", "q": "Worst-case complexity for inserting an entire row is:", "options": ["O(1)", "O(C)", "O(R×C)", "O(log R)"], "answer": 2, "explanation": "Moving a full row across a matrix can involve R×C work in the shown model."}, {"section": "Multi-Dimensional Arrays", "q": "Column insertion requires shifting elements:", "options": ["Only in row 0", "In each row to the right", "Up in every row", "Only on diagonal"], "answer": 1, "explanation": "A column insertion shifts the affected elements to the right in each row."}, {"section": "Multi-Dimensional Arrays", "q": "Deleting a value within a row shifts elements:", "options": ["Right", "Left", "Down", "Diagonally"], "answer": 1, "explanation": "After deletion, later elements in that row shift left."}, {"section": "Multi-Dimensional Arrays", "q": "Full matrix traversal complexity is:", "options": ["O(R)", "O(C)", "O(R+C)", "O(R×C)"], "answer": 3, "explanation": "A full traversal visits all R×C cells."}, {"section": "Linear and Binary Search", "q": "Searching means:", "options": ["Sorting the collection", "Finding whether a key exists and its position", "Deleting a key", "Resizing an array"], "answer": 1, "explanation": "Searching determines whether a key exists and, in the shown context, its position."}, {"section": "Linear and Binary Search", "q": "Which search works on sorted and unsorted arrays?", "options": ["Binary only", "Linear", "Neither", "Both require sorted arrays"], "answer": 1, "explanation": "Linear search can be used whether or not the array is sorted."}, {"section": "Linear and Binary Search", "q": "Linear search checks elements:", "options": ["One by one from the start", "Only in the middle", "By halving the array", "After sorting only"], "answer": 0, "explanation": "Linear search checks elements sequentially from the start."}, {"section": "Linear and Binary Search", "q": "Linear search returns what when the key is found?", "options": ["Always the key value", "The index", "-1", "Array capacity"], "answer": 1, "explanation": "The shown linear-search function returns the index where the key is found."}, {"section": "Linear and Binary Search", "q": "The shown linear search returns what if key is absent?", "options": ["0", "1", "n", "-1"], "answer": 3, "explanation": "The shown function uses -1 to indicate that the key was not found."}, {"section": "Linear and Binary Search", "q": "Linear search best case is:", "options": ["O(1)", "O(n)", "O(log n)", "O(n²)"], "answer": 0, "explanation": "If the key is found immediately, only one check is needed."}, {"section": "Linear and Binary Search", "q": "Linear search worst case is:", "options": ["O(1)", "O(log n)", "O(n)", "O(n log n)"], "answer": 2, "explanation": "In the worst case, linear search may check all n elements."}, {"section": "Linear and Binary Search", "q": "Binary search requires the array to be:", "options": ["Sorted", "All positive", "Odd-sized", "Unique-valued"], "answer": 0, "explanation": "Binary search requires sorted data so it can discard half the search range."}, {"section": "Linear and Binary Search", "q": "If arr[mid] < key, binary search moves to the:", "options": ["Left half", "Right half", "Both halves", "Empty array"], "answer": 1, "explanation": "If the midpoint value is smaller than the key, the key must be in the right half."}, {"section": "Linear and Binary Search", "q": "If arr[mid] > key, the code sets:", "options": ["low = mid + 1", "high = mid - 1", "low = 0 always", "key = mid"], "answer": 1, "explanation": "When the midpoint value is greater than the key, high is moved to mid - 1."}, {"section": "Linear and Binary Search", "q": "The iterative binary search loop condition is:", "options": ["low < high", "low == high", "low <= high", "low >= high"], "answer": 2, "explanation": "The shown iterative version continues while low <= high."}, {"section": "Linear and Binary Search", "q": "The midpoint expression used in the C++ code is:", "options": ["low + (high-low)/2", "low + high × 2", "high-low", "low/2"], "answer": 0, "explanation": "The shown expression calculates the midpoint as low + (high-low)/2."}, {"section": "Linear and Binary Search", "q": "Recursive binary search base case for an empty range is:", "options": ["low == high returns 0", "low > high returns -1", "mid < 0 returns key", "key == 0 returns -1"], "answer": 1, "explanation": "When low becomes greater than high, the search range is empty and the function returns -1."}, {"section": "Linear and Binary Search", "q": "Binary search best case is:", "options": ["O(1)", "O(n)", "O(log n)", "O(n²)"], "answer": 0, "explanation": "If the first midpoint checked is the target, the best case is O(1)."}, {"section": "Linear and Binary Search", "q": "Binary search average and worst case are:", "options": ["O(1)", "O(n)", "O(log n)", "O(n²)"], "answer": 2, "explanation": "Binary search halves the search range, giving O(log n) average and worst-case complexity."}, {"section": "Linear and Binary Search", "q": "In [12,23,34,45,56,67,78], value at midpoint index 3 is:", "options": ["34", "45", "56", "67"], "answer": 1, "explanation": "Index 3 contains 45."}, {"section": "Linear and Binary Search", "q": "In the PPT dry run for key 56, after checking 45 at index 3, range becomes:", "options": ["low=0, high=2", "low=4, high=6", "low=3, high=6", "low=4, high=4"], "answer": 1, "explanation": "Because 45 is less than 56, the next range is indices 4 through 6."}, {"section": "Linear and Binary Search", "q": "After checking 67 at index 5 for key 56, range becomes:", "options": ["low=0, high=3", "low=4, high=4", "low=6, high=6", "low=5, high=4"], "answer": 1, "explanation": "Because 67 is greater than 56, high moves to 4 while low remains 4."}, {"section": "Linear and Binary Search", "q": "Binary search needs roughly how many worst-case comparisons for 1,000,000 elements, as stated?", "options": ["About 20", "About 1,000", "About 100,000", "About 1,000,000"], "answer": 0, "explanation": "The PPT states roughly 20 comparisons for one million elements."}, {"section": "Linear and Binary Search", "q": "If data is unsorted, binary search may require extra:", "options": ["Sorting cost", "Memory deletion", "Index conversion", "Array duplication"], "answer": 0, "explanation": "Unsorted data may need to be sorted first, adding sorting cost."}];
let i=0, score=0, answered=false;
const letters=["A","B","C","D"];
const $=id=>document.getElementById(id);
function render(){
 answered=false;
 const x=questions[i];
 $("counter").textContent=`Question ${i+1} of ${questions.length}`;
 $("score").textContent=`Score: ${score}`;
 $("section").textContent=x.section;
 $("question").textContent=x.q;
 $("bar").style.width=((i+1)/questions.length*100)+"%";
 $("feedback").className="feedback hidden"; $("feedback").innerHTML="";
 $("next").classList.add("hidden");
 $("options").innerHTML="";
 x.options.forEach((o,k)=>{
  const b=document.createElement("button"); b.className="opt"; b.innerHTML=`<b>${letters[k]}.</b> ${o}`;
  b.onclick=()=>choose(k,b); $("options").appendChild(b);
 });
}
function choose(k,clicked){
 if(answered)return; answered=true;
 const x=questions[i], all=[...document.querySelectorAll(".opt")];
 all.forEach((b,n)=>{b.disabled=true;if(n===x.answer)b.classList.add("correct")});
 const ok=k===x.answer;
 if(ok)score++;
 if(!ok)clicked.classList.add("wrong");
 $("score").textContent=`Score: ${score}`;
 const f=$("feedback"); f.className="feedback "+(ok?"correct":"wrong");
 f.innerHTML=`<strong>${ok?"✓ Correct!":"✗ Incorrect"}</strong><br>${ok?"Your answer is correct.":"Correct answer: <b>"+letters[x.answer]+". "+x.options[x.answer]+"</b><br>"}<div style="margin-top:7px"><b>Explanation:</b> ${x.explanation}</div>`;
 $("next").classList.remove("hidden");
 $("next").textContent=i===questions.length-1?"View Final Result →":"Next Question →";
}
$("next").onclick=()=>{if(i<questions.length-1){i++;render()}else finish()};
$("restart").onclick=()=>{i=0;score=0;$("quiz").classList.remove("hidden");$("result").classList.add("hidden");render()};
function finish(){
 $("quiz").classList.add("hidden"); $("result").classList.remove("hidden");
 const pct=Math.round(score/questions.length*100);
 let msg=pct>=80?"Excellent work!":pct>=60?"Good job!":"Keep practicing — you can improve!";
 $("result").innerHTML=`<div class="score">${score}/${questions.length}</div><h2>${msg}</h2><p>You scored <b>${pct}%</b>.</p><button class="btn" onclick="document.getElementById('restart').click()">Try Again</button>`;
}
render();
</script>
</body>
</html>
